services:
  - type: web
    name: aidh-dounia-campaign
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
